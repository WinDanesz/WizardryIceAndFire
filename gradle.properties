# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
use_modern_java_syntax = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = INDEV
root_package = com.windanesz.ifspellpack
mod_id = ifspellpack
mod_name = Wizardry: Ice and Fire

# Mod Metadata
mod_description =
mod_url = https://www.curseforge.com/minecraft/mc-mods/wizardry-ice-and-fire
mod_update_json = https://raw.githubusercontent.com/WinDanesz/WizardryIceAndFire/1.12.2/.forge/update.json
mod_authors = WinDanesz, ipnaedip
mod_credits =
mod_logo_path = assets/ifspellpack/textures/gui/logo.png

# Minecraft / Mapping
minecraft_version = 1.12.2
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = WinDanesz
extra_jvm_args = -Dfml.coreMods.load=com.windanesz.ifspellpack.core.IFSPMixinLoader
extra_tweak_classes =

# Maven Publishing (disabled by default)
publish_to_maven = false
publish_to_local_maven = false
maven_name = Wizardry-Ice-and-Fire
maven_url = https://maven.pkg.github.com/WinDanesz/WizardryIceAndFire

# Publishing
release_type = release
publish_with_changelog = false

publish_to_curseforge = false
curseforge_project_id = 559525
curseforge_debug = false

publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# Deobf Dependencies
wizardry_projectid = 265642
wizardry_version = 4.3.13
wizardry_fileid = 5216846
baubles_projectid = 227083
baubles_version = 1.5.2
baubles_fileid = 2518667
jei_projectid = 238222
jei_version = 4.16.1.302
jei_fileid = 3043174
antiqueatlas_projectid = 227795
antiqueatlas_version = 1.0.6
antiqueatlas_fileid = 2823030
wizardry_utils_version = 1.2.0
wizardryutils_projectid = 608287
wizardryutils_fileid = 5338903
mixinbooter_projectid = 419286
mixinbooter_fileid = 4090558
iceandfire_projectid = 457668
iceandfire_fileid = 5738729
llibrary_projectid = 243298
llibrary_fileid = 2505007

# Tags
use_tags = true
tag_class_name = ${root_package}.Tags

# Access Transformers
use_access_transformer = true
access_transformer_locations = META-INF/accesstransformer.cfg

# Mixins
use_mixins = true
mixin_booter_version = 10.0
generate_mixins_json = false
mixin_configs = ifspellpack
mixin_refmap = ifspellpack.refmap.json

# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.windanesz.ifspellpack.core.IFSPLoadingPlugin

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5

# Modify Minecraft Sources
change_minecraft_sources = false
