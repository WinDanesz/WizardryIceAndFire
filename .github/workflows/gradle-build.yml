name: Gradle Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Prepare Minecraft server for startup test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          echo "online-mode=false" > run/server.properties

      - name: Test server startup (10 second run)
        timeout-minutes: 10
        run: |
          ./gradlew runServer --no-daemon > /tmp/server-output.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true' EXIT

          echo "Server started with PID $SERVER_PID, waiting 10 seconds..."
          sleep 10

          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "::error::Server process crashed during startup!"
            echo "=== Server Output ==="
            cat /tmp/server-output.log
            exit 1
          fi

          if grep -qE "Exception in thread|Caused by:|/FATAL\]" /tmp/server-output.log; then
            echo "::error::Errors found in server output!"
            echo "=== Server Output ==="
            cat /tmp/server-output.log
            exit 1
          fi

          echo "Server ran for 10 seconds without errors. Shutting down..."
          echo "=== Server Output ==="
          cat /tmp/server-output.log
          echo "Server startup test passed!"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 30